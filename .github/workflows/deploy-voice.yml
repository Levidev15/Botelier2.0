name: Deploy Voice Backend to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "botelier/backend/**"
      - "src/pipecat/**"

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build from repo root so the Dockerfile can COPY both
      # botelier/backend/ and src/pipecat/ (which lives at repo root level).
      - name: Build and push Docker image
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/botelier-voice"
          docker build \
            -f botelier/backend/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ secrets.ACA_APP_NAME }} \
            --resource-group ${{ secrets.ACA_RESOURCE_GROUP }} \
            --image "${{ secrets.ACR_LOGIN_SERVER }}/botelier-voice:${{ github.sha }}"

      - name: Verify deployment health
        run: |
          echo "Waiting 30s for container to start..."
          sleep 30
          STATUS=$(az containerapp show \
            --name ${{ secrets.ACA_APP_NAME }} \
            --resource-group ${{ secrets.ACA_RESOURCE_GROUP }} \
            --query "properties.runningStatus" -o tsv)
          echo "Container App status: $STATUS"
          if [ "$STATUS" != "Running" ]; then
            echo "Deployment may not be healthy — check Azure portal"
            exit 1
          fi
