name: Deploy Voice Backend to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "botelier/backend/**"
      - "src/pipecat/**"

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Build context is repo root so the Dockerfile can COPY both
      # botelier/backend/ and src/pipecat/ (which lives at repo root level).
      - name: Build and push Docker image
        run: |
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/botelier-voice"
          docker build \
            -f botelier/backend/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Azure Container Apps
        run: |
          # min/max-replicas pinned to 1 on every deploy: call state (CallHandler,
          # pipeline registry, pre-warm cache) is process-local, so >1 replica
          # misroutes Twilio callbacks and scale-in kills live calls. Enforcing
          # it here also brings pre-existing apps (created with max-replicas 10)
          # into compliance. See scripts/azure-voice-setup.sh.
          az containerapp update \
            --name ${{ secrets.ACA_APP_NAME }} \
            --resource-group ${{ secrets.ACA_RESOURCE_GROUP }} \
            --image "${{ secrets.ACR_LOGIN_SERVER }}/botelier-voice:${{ github.sha }}" \
            --min-replicas 1 \
            --max-replicas 1
          echo "Deployed scale config:"
          az containerapp show \
            --name ${{ secrets.ACA_APP_NAME }} \
            --resource-group ${{ secrets.ACA_RESOURCE_GROUP }} \
            --query "properties.template.scale" -o json

      - name: Wait for deployment and verify health
        run: |
          APP="${{ secrets.ACA_APP_NAME }}"
          RG="${{ secrets.ACA_RESOURCE_GROUP }}"
          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" \
                   --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "Polling https://$FQDN/api/health ..."
          for i in $(seq 1 12); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/api/health" || true)
            if [ "$HTTP" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP — waiting 15s..."
            sleep 15
          done
          echo "Health check did not pass after 3 minutes — check Azure portal logs"
          exit 1
